# "test" profili: asosiy application.properties ustidan faqat DB sozlamalarini almashtiradi.
# Xotiradagi H2 bazasi (PostgreSQL rejimida) — real Postgres kerak emas
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Tezkor H2 testlarida sxemani Hibernate yaratadi; Flyway real Postgres testlarida tekshiriladi
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
