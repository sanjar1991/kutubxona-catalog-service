spring.datasource.url=jdbc:postgresql://localhost:5432/kutubxona
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:parol}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# Ijara qoidalari
library.loan.max-active-per-member=5
library.loan.period-days=14
# Muddati o'tganlarni tekshirish jadvali (har kuni 01:00)
library.loan.overdue-cron=0 0 1 * * *
