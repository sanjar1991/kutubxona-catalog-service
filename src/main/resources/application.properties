# Ma'lumotlar bazasi — qiymatlar muhit o'zgaruvchilaridan olinadi.
# DB_PASSWORD majburiy: u berilmasa ilova ishga tushmaydi (parol kodda saqlanmaydi).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kutubxona}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Sxemani Flyway boshqaradi (src/main/resources/db/migration).
# Hibernate faqat entity'lar va jadvallar mosligini tekshiradi.
spring.jpa.hibernate.ddl-auto=validate
# Flyway'dan oldin yaratilgan (bo'sh bo'lmagan) bazada ham V1 qo'llansin
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Ijara qoidalari
library.loan.max-active-per-member=5
library.loan.period-days=14
# Muddati o'tganlarni tekshirish jadvali (har kuni 01:00)
library.loan.overdue-cron=0 0 1 * * *
